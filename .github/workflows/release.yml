name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/checksums.txt

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/vulncheck-oss/mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref, '-') }}

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes ghcr.io/vulncheck-oss/mcp@${{ steps.push.outputs.digest }}

  mcp-registry:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Wait for Docker image
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          IMAGE="ghcr.io/vulncheck-oss/mcp:$VERSION"

          for i in {1..10}; do
            if docker manifest inspect "$IMAGE" &>/dev/null; then
              echo "✅ Docker image ready: ${{ github.ref_name }}"
              break
            fi
            [ $i -eq 10 ] && { echo "❌ Timeout waiting for ${{ github.ref_name }} after 5 minutes"; exit 1; }
            echo "⏳ Waiting for Docker image ($i/10)..."
            sleep 30
          done

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Update server.json version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed -i "s/\${VERSION}/$VERSION/g" server.json
          echo "Version: $VERSION"

      - name: Validate server.json
        run: python3 -m json.tool server.json > /dev/null && echo "✅ server.json valid"

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
